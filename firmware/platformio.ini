[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    adafruit/Adafruit PWM Servo Driver Library@^2.4.1
    adafruit/Adafruit BusIO@^1.14.1
    wire
    
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    
upload_speed = 921600
